name: Droid Tag

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, edited]

jobs:
  droid:
    if: |
      (
        (github.event_name == 'issue_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(format('{0}', github.event.comment.body), '@droid')) ||
        (github.event_name == 'pull_request_review_comment' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && contains(format('{0}', github.event.comment.body), '@droid')) ||
        (github.event_name == 'pull_request_review' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association) && contains(format('{0}', github.event.review.body), '@droid')) ||
        (github.event_name == 'issues' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) && (contains(format('{0}', github.event.issue.body), '@droid') || contains(format('{0}', github.event.issue.title), '@droid'))) ||
        (github.event_name == 'pull_request' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) && (contains(format('{0}', github.event.pull_request.body), '@droid') || contains(format('{0}', github.event.pull_request.title), '@droid')))
      )
    runs-on: [self-hosted, Linux, X64, droid-agent]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Droid Exec
        uses: Factory-AI/droid-action@8ea31f351ee6636ebef918ccb64682f477af7184
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
